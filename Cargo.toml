[package]
name = "igit-workbench"
version = "0.1.0"
edition = "2021"
description = "IGit multi-repository terminal Git workbench"
default-run = "igit"

[lib]
name = "igit"
path = "src/lib.rs"

[[bin]]
name = "igit"
path = "src/bin/igit.rs"

[[bin]]
name = "ig"
path = "src/bin/ig.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28.1"
nerd-font-symbols = "0.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
similar = "2"
unicode-width = "0.2"
regex-lite = "0.1"

[profile.release]
strip = true
