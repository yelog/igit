      const state=decided[i]?' mg-done':'';
      const tint=x.type?' mg-'+x.type:'';
      const cells=Array.from({length:max},(_,j)=>{
        const val=lines[j], ln=val===undefined?'':++n;
        const rg=x.type==='conflict'||(s==='left'&&x.l)||(s==='right'&&x.r);
        const gutter=x.id&&s!=='result'&&j===0&&rg&&phase==='editing'&&!edit
          ?'<button title="'+(s==='left'?'采用左侧':'采用右侧')+' · '+x.id+'" aria-label="'+(s==='left'?'采用左侧':'采用右侧')+' '+x.id+'" class="mg-arrow" data-pick="'+s+'" data-at="'+i+'">'+(s==='left'?'»':'«')+'</button>':'';
        return '<div class="mg-line'+(val===undefined?' mg-blank':'')+'"><span class="mg-num">'+ln+'</span><code>'+syntax(val||'')+'</code>'+gutter+'</div>';
      }).join('');
      return '<div class="mg-seg'+active+state+tint+'" data-seg="'+i+'" '+(x.id?'data-id="'+x.id+'"':'')+'>'+cells+'</div>';
    }).join('');
    return '<section class="mg-pane'+selected+'" data-side="'+s+'" tabindex="0" '+(s==='result'?'data-default-focus':'')+' data-pane aria-label="'+title(s)+' '+(s==='result'?'可编辑':'只读')+'">'+out+'</section>';
  }
  function render(){
    if(!screen())return;
    if(isOpen()) vertical=getBody()?.scrollTop||0;
    const conflicts=waiting('conflict'), safe=waiting('safe');
    const read=phase!=='editing';
    const cols=[['left','01 / CURRENT','feature/resilience','8e56a2c'],['result','02 / RESULT','合并结果','可编辑'],['right','03 / INCOMING','main','4bc8d71']];
    const selectInfo=seg[sel].id?seg[sel].id+' · '+(decided[sel]?km[decided[sel]]:seg[sel].type==='conflict'?'待解决冲突':'非冲突变更'):'上下文';
    const scopeNote=F.scope&&!F.scope.has('atlas-web');
    screen().innerHTML='<div class="mg-app" data-view="'+mode+'">'+
    '<div class="mg-filehead"><div class="mg-path">'+F.dot('atlas-web')+'<b>atlas-web</b><span class="mg-slash">/</span><span>src/net/</span><strong>client.ts</strong></div><div class="mg-phase"><i></i>'+ (phase==='done'?'MERGE COMPLETE':phase==='applied'?'FILE RESOLVED':'MERGE IN PROGRESS')+'</div></div>'+
    (scopeNote?'<div class="mg-note">atlas-web 不在当前筛选范围；保留此文件草稿，将对应仓库加入范围后可应用结果。</div>':'')+
    '<div class="mg-tools"><div class="mg-toolgroup">'+btn('↑','prev','','上一个冲突 [c')+btn('↓','next','','下一个冲突 ]c')+'<span class="mg-vr"></span>'+
    '<button class="mg-btn mg-auto" data-mg-act="auto" '+(read||!safe?'disabled':'')+' title="应用所有非冲突变更 [a]">» 应用非冲突变更 <b>'+pad(safe)+'</b></button></div>'+
    '<div class="mg-toolgroup"><span class="mg-confcount">'+pad(conflicts)+' <span>冲突待解决</span></span><span class="mg-vr"></span><button class="mg-btn" data-mg-act="undo" '+(!history.length||read?'disabled':'')+' title="撤销上次改动 [u]">↶ 撤销</button><button class="mg-btn mg-zoom" data-mg-act="zoom" title="放大 / 恢复当前栏 [z]">'+(mode==='all'?'⛶ 单栏':'▥ 三栏')+'</button></div></div>'+
    '<div class="mg-width"><div class="mg-cols mg-colhead">'+cols.map(([s,num,label,meta])=>'<div class="mg-heading" data-side="'+s+'"><div class="mg-kicker"><span>'+num+'</span><span>'+(s==='result'?(read?'已确认':'EDIT'):'RO')+'</span></div><strong>'+label+'</strong><small>'+meta+'</small></div>').join('')+'</div><div class="mg-scroll"><div class="mg-cols mg-code">'+allSide.map(makePane).join('')+'</div></div></div>'+
    '<div class="mg-actionbar"><div class="mg-blocktag"><span class="mg-tagdot"></span>'+h(selectInfo)+'</div><div class="mg-actions">'+(read?'':(current().id?btn('» 取左','left','','采用左侧当前块 [H]')+btn('取右 «','right','','采用右侧当前块 [L]')+(current().type==='conflict'?btn('取两侧','both','','依次保留左侧和右侧 [b]'):''):'')+btn('编辑结果','edit','','编辑中栏当前块 [i]'))+'</div></div>'+
    '<div class="mg-foot"><span class="mg-legend"><i class="mg-leg-safe"></i> 非冲突 <i class="mg-leg-conf"></i> 冲突 <i class="mg-leg-done"></i> 已处理</span><div class="mg-actions">'+
    (phase==='editing'?(saved&&!same({b:buf,d:decided},{b:saved.buf,d:saved.decided})?btn('恢复草稿','restore','','恢复最近保存的会话草稿'):'')+btn('保存草稿','save','','保存当前会话内的草稿 [s]')+'<button class="mg-btn mg-apply" data-mg-act="apply" '+((conflicts||safe||scopeNote)?'disabled':'')+' title="'+((conflicts||safe)?'先处理全部冲突与非冲突变更':'确认并标记此文件已解决')+'">应用结果 ↵</button>':phase==='applied'?btn('返回编辑','back')+'<button class="mg-btn mg-apply" data-mg-act="continue" '+(scopeNote?'disabled':'')+'>继续 Merge →</button>':btn('重看示例','reset')+btn('返回 Log →','log','mg-apply'))+
    '</div></div></div>';
    const box=screen().querySelector('.mg-app');
    box.querySelectorAll('[data-mg-act]').forEach(el=>el.onclick=()=>act(el.dataset.mgAct));
    box.querySelectorAll('.mg-pane').forEach(el=>{
      el.onfocus=()=>{side=el.dataset.side;box.querySelectorAll('.mg-pane-focus').forEach(v=>v.classList.remove('mg-pane-focus'));el.classList.add('mg-pane-focus');};
      el.onclick=e=>{
        if(edit)return;
        const b=e.target.closest('[data-pick]');
        if(b){sel=+b.dataset.at;side=el.dataset.side;applyChoice(b.dataset.pick);return;}
        const row=e.target.closest('[data-seg]');
        if(row){sel=+row.dataset.seg;side=el.dataset.side;box.querySelectorAll('.mg-sel').forEach(i=>i.classList.remove('mg-sel'));box.querySelectorAll('[data-seg="'+sel+'"]').forEach(i=>i.classList.add('mg-sel'));el.focus({preventScroll:true});
          if(e.detail>=2&&side==='result'&&!read){beginEdit();return;}
          if(side==='result'&&!read){clearTimeout(render.delay);render.delay=setTimeout(()=>{if(isOpen()&&!edit)reb(true)},260);}
          else reb(true);
        }
      };
    });
    getBody().scrollTop=vertical;
  }
  function applyChoice(s){
    if(phase!=='editing'||edit||!current().id)return;
    storeUndo();
    buf[sel]=(s==='left'?left(sel):s==='right'?right(sel):left(sel).concat(right(sel))).slice();
    decided[sel]=s;reb(true,true);
    F.toast(current().id+' · '+km[s]+'；按 u 撤销');
  }
  function autos(){
    if(phase!=='editing'||!waiting('safe'))return;
    storeUndo();let n=0;
    seg.forEach((x,i)=>{if(x.type==='safe'&&!decided[i]){buf[i]=(x.l||x.r).slice();decided[i]='auto';n++}});
    const first=seg.findIndex((x,i)=>x.type==='conflict'&&!decided[i]);if(first!==-1)sel=first;
    reb(true,true);F.toast('已应用 '+n+' 处非冲突变更；保留 '+waiting('conflict')+' 处冲突供确认。');
  }
  function nav(step){
    if(edit)return;
    let options=seg.map((x,i)=>x.type==='conflict'&&!decided[i]?i:-1).filter(i=>i>=0);
    if(!options.length)options=seg.map((x,i)=>x.type==='conflict'?i:-1).filter(i=>i>=0);
    const next=(step>0?options.find(i=>i>sel):options.slice().reverse().find(i=>i<sel))??(step>0?options[0]:options.at(-1));
    if(next!=null){sel=next;reb(true,true);}
  }
  function beginEdit(initial){
    if(phase!=='editing'||edit)return;
    clearTimeout(render.delay);side='result';if(mode!=='all'&&mode!=='result')mode='result';
    reb(true,true);
    edit=true;
    const row=screen().querySelector('.mg-pane[data-side="result"] [data-seg="'+sel+'"]');
    row.innerHTML='<div class="mg-ed"><textarea aria-label="编辑合并结果当前块" spellcheck="false" rows="'+Math.min(12,Math.max(3,buf[sel].length+1))+'"></textarea><div><button data-ed="discard">取消 Esc</button><button data-ed="confirm">确认 Ctrl↵</button></div></div>';
    row.querySelector('textarea').value=initial??buf[sel].join('\n');liveEdit={sel, value:row.querySelector('textarea').value};
    const end=(yes)=>{if(!edit)return;const t=row.querySelector('textarea');if(yes&&t){storeUndo();buf[sel]=t.value===''?[]:t.value.split('\n');if(current().id)decided[sel]='manual'}
      edit=false;liveEdit=null;reb(true,true);F.toast(yes?'已更新中栏结果':'已取消本块编辑');};
    const ta=row.querySelector('textarea');
    ta.oninput=()=>{liveEdit={sel,value:ta.value};};
    const align=()=>{if(!row.isConnected)return;const height=row.offsetHeight;screen().querySelectorAll('.mg-pane:not([data-side="result"]) [data-seg="'+sel+'"]').forEach(el=>el.style.minHeight=height+'px');};align();
    if(window.ResizeObserver){const observer=new ResizeObserver(()=>{if(!row.isConnected){observer.disconnect();return;}align()});observer.observe(row);}
    ta.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();end(false)}else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();e.stopPropagation();end(true)}};
    row.querySelector('[data-ed="discard"]').onclick=e=>{e.stopPropagation();end(false)};
    row.querySelector('[data-ed="confirm"]').onclick=e=>{e.stopPropagation();end(true)};
    ta.focus({preventScroll:true});ta.setSelectionRange(ta.value.length,ta.value.length);reveal();
  }
  function confirmDialog(title,text,primary,cb){
    F.modal(title,'<p class="mg-dialog-text">'+h(text)+'</p><div class="mg-dialog-buttons">'+btn('取消','no')+btn(h(primary),'yes','mg-apply')+'</div>',el=>{
      el.querySelector('[data-mg-act="no"]').onclick=()=>F.close();
      el.querySelector('[data-mg-act="yes"]').onclick=()=>{F.close();cb()};
    });
  }
  function act(a){
    if(edit){F.toast('请先确认或取消中栏编辑。');return;}
    if(a==='auto')return autos();
    if(a==='prev'||a==='next')return nav(a==='next'?1:-1);
    if(['left','right','both'].includes(a))return applyChoice(a);
    if(a==='edit')return beginEdit();
    if(a==='zoom'){mode=mode==='all'?side:'all';reb(true,true);return;}
    if(a==='undo'&&history.length&&phase==='editing'){const x=history.pop();buf=x.buf;decided=x.decided;sel=x.sel;reb(true,true);F.toast('已撤销上一步。');return;}
    if(a==='restore'&&saved){confirmDialog('恢复会话草稿','用上一次保存的结果替换现有编辑；这一步可以撤销。','恢复草稿',()=>{storeUndo();buf=saved.buf.map(x=>x.slice());decided={...saved.decided};sel=saved.sel;reb(true,true);F.toast('已恢复会话草稿。')});return;}
    if(a==='save'){saved=snap();F.toast('草稿已保留在当前演示会话；未应用到文件。');return;}
    if(a==='apply'&&phase==='editing'){
      if(!F.scope.has('atlas-web')){F.toast('请先将 atlas-web 加入仓库范围。');return;}
      if(waiting('safe')||waiting('conflict')){F.toast('先处理全部冲突与非冲突变更。');return;}
      confirmDialog('应用合并结果','将 src/net/client.ts 标记为已解决。本步只确认这个文件；整个 Merge 仍在等待继续。','应用到文件',()=>{phase='applied';reb();F.toast('文件已解决。可返回编辑，或继续仓库 Merge。')});return;
    }
    if(a==='back'){phase='editing';reb();return;}
    if(a==='continue'&&phase==='applied'&&F.scope.has('atlas-web')){
      confirmDialog('继续 atlas-web 的 Merge','本示例的冲突文件已全部解决。继续后结束这个仓库的合并演练。','继续 Merge',()=>{phase='done';reb();F.toast('atlas-web · 合并演练已完成')});return;
    }
    if(a==='reset'){buf=seg.map(x=>x.v.slice());decided={};sel=3;history=[];phase='editing';saved=null;liveEdit=null;side='result';mode='all';vertical=0;reb();return;}
    if(a==='log')F.go('log');
  }
  function key(e){
    if(!isOpen())return;
    if(edit){if(!e.target.closest('.mg-ed')){e.preventDefault();screen().querySelector('.mg-ed textarea')?.focus();}return;}
    if(e.target.closest('input,textarea,select,[contenteditable="true"]')||e.metaKey||e.ctrlKey||e.altKey)return;
    const k=e.key;
    if(prefix&&Date.now()-prefixAt>1100)prefix='';
    if(k==='['||k===']'){prefix=k;prefixAt=Date.now();e.preventDefault();return;}
    if(k==='c'&&prefix){const d=prefix;prefix='';e.preventDefault();nav(d===']'?1:-1);return;}
    prefix='';
    if('jk'.includes(k)&&k.length===1){e.preventDefault();sel=Math.max(0,Math.min(seg.length-1,sel+(k==='j'?1:-1)));reb(true,true);return;}
    if((k==='h'||k==='l')&&allSide.includes(side)){e.preventDefault();side=allSide[Math.max(0,Math.min(2,allSide.indexOf(side)+(k==='h'?-1:1)))];if(mode!=='all'){mode=side;reb(true)}else focusPane(side);return;}
    const actions={'a':'auto','H':'left','L':'right','b':'both','u':'undo','i':'edit','s':'save','z':'zoom'};
    if(actions[k]){e.preventDefault();if(k==='b'&&current().type!=='conflict')return;act(actions[k]);}
    if(k==='Enter'&&e.shiftKey){e.preventDefault();act('apply');}
  }
  function enter(){
    const work=liveEdit;
    edit=false;
    render();
    if(work&&phase==='editing'){sel=work.sel;beginEdit(work.value);}
  }
  F.register('merge',{render:enter,key,hint:'[c / ]c 冲突   H / L 取左 / 右   a 应用非冲突   i 编辑   u 撤销'});
})();

IGboot();</script></body></html>
