# IGit built-in defaults. Copy only settings you want to override.
# Arrays replace defaults; [] disables a command. Restart IGit to apply changes.
# F1, Esc, text editing, text selection, and confirmation controls stay fixed.

version = 1

[terminal]
mouse = true

[ui]
icons = "nerd-font"

[ai]
# Full OpenAI-compatible chat completions URL, including its path.
# A user [ai] table takes precedence over saved workspace AI settings.
endpoint = ""
model = ""
prompt = "Write one concise Conventional Commit message covering exactly the selected changes across all supplied repositories. Return only the commit message, without Markdown fences or commentary."
api_key_env = "IGIT_LLM_API_KEY"
# Per-request timeout in seconds (1..=600).
timeout_seconds = 60
# Maximum input bytes per request (8 KiB..=2 MiB).
input_budget_bytes = 160000
# Total requests, including reductions and final generation (1..=128).
max_requests = 32
# Deadline for the entire AI job in seconds (1..=3600).
total_timeout_seconds = 300

[updates]
check_on_startup = true
check_interval_hours = 24

[keybindings]
# Prefix hints appear after this delay; prefixes remain until used or canceled.
hint_delay_ms = 200
# Use Ctrl/Alt/Shift/Super with - or +; separate sequence steps with spaces.
# Command tables apply in normal mode in their original panel/context.

[keybindings.global]
focus-commit = ["1"]
focus-log = ["2"]
open-push = ["3"]
focus-branch = ["4"]
focus-stash = ["5"]
focus-remote = ["6"]
open-merge = ["7"]
pull = ["p"]
fetch = ["f"]
update = ["F9"]
notification-history = ["Space n"]
roots = ["r"]
actions = [":"]
refresh = ["F5"]
help = ["?"]
quit = ["q", "Ctrl-c"]

[keybindings.panes]
focus-next = ["Tab", "F6"]
focus-previous = ["Shift-Tab", "Shift-F6"]
focus-left = ["Ctrl-w h", "Ctrl-w Ctrl-h"]
focus-down = ["Ctrl-w j", "Ctrl-w Ctrl-j"]
focus-up = ["Ctrl-w k", "Ctrl-w Ctrl-k"]
focus-right = ["Ctrl-w l", "Ctrl-w Ctrl-l"]
# Opt-in: internal panes first, then the neighboring Kitty window at an edge.
# Use single modified chords, e.g. ["Cmd+Ctrl+h"]. See docs/configuration.md.
smart-focus-pane-left = []
smart-focus-pane-down = []
smart-focus-pane-up = []
smart-focus-pane-right = []
# Move an internal divider by 3 cells; hand off to Kitty when absent or clamped.
# Example: ["Cmd+Ctrl+Shift+h"]. Kitty requires contrib/kitty/igit_resize.py.
smart-resize-pane-left = []
smart-resize-pane-down = []
smart-resize-pane-up = []
smart-resize-pane-right = []
# Maximize the focused pane in Commit, Push, or Conflicts. The smart command also toggles Kitty stack.
toggle-pane-maximized = ["Ctrl-w f"]
smart-toggle-pane-maximized = []
cycle = ["Ctrl-w w", "Ctrl-w Ctrl-w"]
increase-width = ["Ctrl-w >"]
decrease-width = ["Ctrl-w <"]
increase-height = ["Ctrl-w +"]
decrease-height = ["Ctrl-w -"]
reset-sizes = ["Ctrl-w ="]
close-log-tab = ["Ctrl-w c"]

[keybindings.remote]
add = ["a", "+", "Insert"]
edit = ["e", "F2"]
remove = ["d", "-", "Delete"]
move-down = ["j", "Down"]
move-up = ["k", "Up"]
collapse = ["h", "Left"]
expand = ["l", "Right"]
toggle = ["Space"]
open = ["Enter"]
first-item = ["g", "Home"]
last-item = ["G", "End"]
page-down = ["PgDn", "Ctrl-f"]
page-up = ["PgUp", "Ctrl-b"]

