# IGit built-in defaults. Copy only settings you want to override.
# Arrays replace defaults; [] disables a command. Restart IGit to apply changes.
# F1, Esc, text editing, text selection, and confirmation controls stay fixed.

version = 1

[terminal]
mouse = true

[ui]
icons = "nerd-font"

[keybindings]
# Prefix hints appear after this delay; prefixes remain until used or canceled.
hint_delay_ms = 200
# Use Ctrl/Alt/Shift/Super with - or +; separate sequence steps with spaces.
# Command tables apply in normal mode in their original panel/context.

[keybindings.global]
focus-log = ["1"]
focus-commit = ["2"]
open-push = ["3"]
open-merge = ["4"]
pull = ["p"]
fetch = ["f"]
roots = ["r"]
actions = [":"]
refresh = ["F5"]
help = ["?"]
quit = ["q", "Ctrl-c"]

[keybindings.panes]
focus-next = ["Tab", "F6"]
focus-previous = ["Shift-Tab", "Shift-F6"]
focus-left = ["Ctrl-w h", "Ctrl-w Ctrl-h"]
focus-down = ["Ctrl-w j", "Ctrl-w Ctrl-j"]
focus-up = ["Ctrl-w k", "Ctrl-w Ctrl-k"]
focus-right = ["Ctrl-w l", "Ctrl-w Ctrl-l"]
# Opt-in: internal panes first, then the neighboring Kitty window at an edge.
# Use single modified chords, e.g. ["Cmd+Ctrl+h"]. See docs/configuration.md.
smart-focus-pane-left = []
smart-focus-pane-down = []
smart-focus-pane-up = []
smart-focus-pane-right = []
# Move an internal divider by 3 cells; hand off to Kitty when absent or clamped.
# Example: ["Cmd+Ctrl+Shift+h"]. Kitty requires contrib/kitty/igit_resize.py.
smart-resize-pane-left = []
smart-resize-pane-down = []
smart-resize-pane-up = []
smart-resize-pane-right = []
# Maximize the focused IGit pane; the optional smart command also toggles Kitty stack.
toggle-pane-maximized = ["Ctrl-w f"]
smart-toggle-pane-maximized = []
cycle = ["Ctrl-w w", "Ctrl-w Ctrl-w"]
increase-width = ["Ctrl-w >"]
decrease-width = ["Ctrl-w <"]
increase-height = ["Ctrl-w +"]
decrease-height = ["Ctrl-w -"]
reset-sizes = ["Ctrl-w ="]
close-log-tab = ["Ctrl-w c"]

[keybindings.log]
move-down = ["j", "Down"]
move-up = ["k", "Up"]
move-left = ["h", "Left"]
move-right = ["l", "Right"]
first-commit = ["g g"]
first-item = ["g"]
last-item = ["G"]
page-down = ["PgDn", "Ctrl-f"]
page-up = ["PgUp", "Ctrl-b"]
half-page-down = ["Ctrl-d"]
half-page-up = ["Ctrl-u"]
screen-top = ["H"]
screen-middle = ["M"]
screen-bottom = ["L"]
copy-id = ["y y"]
copy-message = ["y m"]
copy-author = ["y a"]
open = ["Enter"]
search = ["/"]
search-refs = ["S"]
branch-filter = ["Space b"]
user-filter = ["Space u"]
date-filter = ["Space d"]
paths-filter = ["Space p"]
clear-filters = ["x"]
view-options = ["o"]
toggle-refs = ["B"]
toggle-inspector = ["I"]
toggle-current-highlight = ["H"]
toggle-reference-labels = ["L"]
select-ref = ["s"]
previous-tab = ["["]
next-tab = ["]"]
new-tab = ["Ctrl-t"]
load-more = ["+"]
collapse-all = ["z"]
expand-all = ["Z"]

[keybindings.commit]
move-down = ["j", "Down"]
move-up = ["k", "Up"]
collapse = ["h", "Left"]
expand = ["l", "Right"]
first-item = ["g", "Home"]
last-item = ["G", "End"]
page-down = ["PgDn"]
page-up = ["PgUp"]
toggle = ["Space"]
open = ["Enter"]
move-to-group = ["m"]
preview = ["v"]
view-options = ["o"]
toggle-directories = ["t"]
toggle-status = ["s"]
collapse-all = ["z"]
expand-all = ["Z"]
undo-selection = ["u"]
new-group = ["n"]
edit-message = ["i"]
previous-repo = ["["]
next-repo = ["]"]
amend = ["a"]
ai-draft = ["A"]
ai-settings = ["S"]
review = ["c"]
review-and-push = ["P"]

[keybindings.push]
move-down = ["j", "Down"]
move-up = ["k", "Up"]
collapse = ["h", "Left"]
expand = ["l", "Right"]
open = ["Enter"]
toggle = ["Space"]
edit-target = ["t"]
view-options = ["o"]
review = ["P"]
retry = ["R"]
fetch = ["F"]
follow-tags = ["v"]
skip-hooks = ["x"]
details = ["d"]
collapse-all = ["["]
expand-all = ["]"]

[keybindings.merge]
move-down = ["j", "Down"]
move-up = ["k", "Up"]
first-item = ["g", "Home"]
last-item = ["G", "End"]
open = ["Enter"]
continue = ["C"]
previous-conflict = ["[ c"]
next-conflict = ["] c"]
focus-left = ["h"]
focus-right = ["l"]
scroll-left = ["Left"]
scroll-right = ["Right"]
page-down = ["PgDn"]
page-up = ["PgUp"]
zoom = ["z"]
take-left = ["H"]
take-right = ["L"]
take-both = ["b"]
auto-resolve = ["a"]
edit = ["i"]
undo = ["u"]
save-draft = ["s"]
apply = ["A", "Shift-Enter"]
back-to-files = ["F"]
